name: Lab verification
on:
  push:
    branches: ['lab/**']
permissions:
  contents: read
jobs:
  verify:
    name: trusted-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
